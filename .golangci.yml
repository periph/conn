# Go formatting and static analysis configuration.

version: "2"
run:
  timeout: 5m
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - contextcheck
    - copyloopvar
    - dupl
    - dupword
    - durationcheck
    - embeddedstructfieldcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - funcorder
    - gocheckcompilerdirectives
    - gochecksumtype
    - gocritic
    - godoclint
    - godot
    - gomoddirectives
    - goprintffuncname
    - gosec
    - gosmopolitan
    - govet
    - grouper
    - iface
    - importas
    - inamedparam
    - ineffassign
    - intrange
    - iotamixing
    - loggercheck
    - makezero
    - mirror
    - modernize
    - musttag
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - recvcheck
    - revive
    - sloglint
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  exclusions:
    rules:
      # Preserve public Linux input and connector names used by consumers.
      - path: ^(ir/ir|gpio/func|pin/pin)\.go$
        text: 'var-naming:'
        linters: [revive]
      # These exported names predate the naming rule and are part of the API.
      - path: ^(display/text_display|gpio/group|pin/pin)\.go$
        text: stutters
        linters: [revive]
      # Value formatting and pointer mutation implement distinct public interfaces.
      - path: ^(physic/units|i2c/i2c)\.go$
        linters: [recvcheck]
      # Registry tests reset shared package state and must run serially.
      - path: (^|/)(driverreg|pinreg|i2creg|onewirereg|spireg|uartreg)/.*_test\.go$|(^|/)gpioreg/gpioreg_test\.go$
        linters: [paralleltest]
      # Separate physical-unit implementations preserve specialized formatting,
      # while these test cases cover distinct types and dependency graphs.
      - path: ^(physic/units(_test)?|driver/driverreg/driverreg_test|mmr/mmr_test)\.go$
        linters: [dupl]
      # Timing-sensitive GPIO tests must not contend with one another.
      - path: ^gpio/gpioutil/(debounce|polledge|pulsein)_test\.go$
        linters: [paralleltest]
  settings:
    staticcheck:
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF*", "-SA1019"]
    govet:
      enable:
        - shadow
      disable:
        - unsafeptr
        # Newer stdlib inlining suggestions cannot target the minimum Go version.
        - inline
formatters:
  exclusions:
    generated: lax
  enable:
    - gofmt
    - goimports
